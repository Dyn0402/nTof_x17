</style><h1>Pair quality, by arm pairing</h1><p class="lede">Built by <code>make_pair_qa_figures.py</code> from <code>pair_qa.py</code>’s campaign table — the same pairs the opening-angle figures are drawn from, verified pair for pair. Grey dashed is the event-mixed null in every panel.</p><figure><img src="qa_chi2dof_worst.png" alt="qa_chi2dof_worst"><figcaption><code>qa_chi2dof_worst.png</code> &middot; <code>qa_chi2dof_worst.pdf</code> &middot; <code>qa_chi2dof_worst.csv</code><br>Nothing in this chain cuts on χ². The median pair has a worst-view χ²/dof near 40 and the tail runs past 10⁴.</figcaption></figure>
<figure><img src="qa_n_strips_min.png" alt="qa_n_strips_min"><figcaption><code>qa_n_strips_min.png</code> &middot; <code>qa_n_strips_min.pdf</code> &middot; <code>qa_n_strips_min.csv</code><br>The reconstruction needs ≥ 10, so the left edge is the existing cut and not a feature of the data.</figcaption></figure>
<figure><img src="qa_q_total_min.png" alt="qa_q_total_min"><figcaption><code>qa_q_total_min.png</code> &middot; <code>qa_q_total_min.pdf</code> &middot; <code>qa_q_total_min.csv</code><br>A real pathology: q_total overflows on part of the sample. The median is ~1.8 × 10³ and the 99th percentile is ~10¹³.</figcaption></figure>
<figure><img src="qa_dca_worst.png" alt="qa_dca_worst"><figcaption><code>qa_dca_worst.png</code> &middot; <code>qa_dca_worst.pdf</code> &middot; <code>qa_dca_worst.csv</code><br>The 30 mm selection is the right-hand edge. The distribution rises INTO it, so the cut is not isolating a peak.</figcaption></figure>
<figure><img src="qa_sep_mm.png" alt="qa_sep_mm"><figcaption><code>qa_sep_mm.png</code> &middot; <code>qa_sep_mm.pdf</code> &middot; <code>qa_sep_mm.csv</code><br>For a pair born in a 20 mm capsule this should be small. The median is ~100 mm.</figcaption></figure>
<figure><img src="qa_v_r.png" alt="qa_v_r"><figcaption><code>qa_v_r.png</code> &middot; <code>qa_v_r.pdf</code> &middot; <code>qa_v_r.csv</code><br>The capsule is r = 10 mm. The median vertex sits at ~67 mm.</figcaption></figure>
<figure><img src="qa_dt_track_ns.png" alt="qa_dt_track_ns"><figcaption><code>qa_dt_track_ns.png</code> &middot; <code>qa_dt_track_ns.pdf</code> &middot; <code>qa_dt_track_ns.csv</code><br>NOT a coincidence measurement: both legs share one trigger and a leg’s t0 moves with its depth in the 30 mm gap, so this is dominated by drift depth.</figcaption></figure>
<figure><img src="qa_delta_t.png" alt="qa_delta_t"><figcaption><code>qa_delta_t.png</code> &middot; <code>qa_delta_t.pdf</code> &middot; <code>qa_delta_t.csv</code><br>THE coincidence measurement, and it exists only where both arms are scintillator-tagged. A prompt peak on a broad pedestal — the pedestal is what a timing cut would remove. No mixed null here: tight_coincidence.py writes real pairs only.</figcaption></figure>
<figure><img src="qa_t_flash_ms.png" alt="qa_t_flash_ms"><figcaption><code>qa_t_flash_ms.png</code> &middot; <code>qa_t_flash_ms.pdf</code> &middot; <code>qa_t_flash_ms.csv</code><br>Per trigger, so a pair has exactly one. Whether the six arm pairs are drawn from the same neutron population is a real question.</figcaption></figure>
