# Paper I figure manifest -- read by ../make_figures.py.
# One [fig.<id>] per figure; the .tex includes figures/<id> with no extension.
#   state         current | superseded | placeholder
#   source        repo-relative file to copy (current) or stamp (superseded)
#   producer      shell command, run from the repo root, that (re)makes `source`
#   section_state the PAPER_PLAN state of the section, shown on placeholders
#   aspect        placeholder height / width (default 0.6)
# Rule: nothing that shows a position, angle or depth from combined_hits times
# may be "current" (RECONSTRUCTION_BASIS.md); mark it superseded.

# --- 1 Introduction / 2 Design ------------------------------------------------

