source = "papers/paper1/figs/out/chamber_stack.pdf"
producer = ".venv/bin/python papers/paper1/figs/make_chamber_stack.py"
note = "2026-11-03: replaces the pyvista render with a 2D technical cross-section; every number from docs/detector_spec/spec.py, dagger = assumed/open there. Layer order below the strips follows the response model."

[fig.two_velocities]
title = "Two drift velocities and the gap: the head-on stack (T = g / v), the reference ladder (slope = v, no gap) and g = v_reference x T per field"
state = "current"
source = "rerun/paper1_gas/figures/two_velocities.pdf"
section_state = "partial"
note = "2026-11-02 (Dylan's outline). det3 6-27 drift scan, pass 1. (a) the in30 head-on stacks (rc_diffusion.stack, |tan_x| < 0.03, rr1 waveforms, unsaturated) with the s4f_fit model at its stored sigma_0, Dd, T, dt (A refitted, linear); markers = fitted column start dt and end dt + T. (b) M3 ladder: binned medians of the fitted w - w0 against the bow-corrected M3 slope, X filled / Y open, lines slope v_drift x kw. (c) g = v_ladder x T: 24.9 +- 2.9 / 27.9 +- 0.5 / 27.4 +- 1.1 / 29.4 +- 0.8 mm at 177 / 248 / 319 / 390 V/cm, mean 28.2 +- 0.5 mm (chi2 4.1/3), against the strip-extent gap 28.19 +- 0.19 (S4 re-check). NB: the 29 [28, 30] mm in the story is the gap profile of the timing-v Magboltz fit (results/summary.json scan.profile), not this ratio. Inputs copied from EOS x17rerun/paper1_gas (stacks, fit_v1) and Analysis_pass1 (03_angles, bundles); numbers in results/twov.json. Checklist pass 2026-11-02: full width (6.1 in drawn, 6.22 in PDF), fonts embedded; titles -> (a)-(c), one field legend above, field ramp from det3 tints, (b) y label w - w0. Numbers unchanged. 2026-11-03: field colours viridis 0-0.82 (no chamber colour); 'strip extent' relabelled 'geometric gap L/tan(theta)'."
producer = "cd rerun/paper1_gas && ../../.venv/bin/python pg_twov.py extract <data dir> && ../../.venv/bin/python pg_twov.py fig"

[fig.gas_drying]
title = "Bench gas drying over the night of 6-26 (C, D): measured drift velocity, Magboltz-inverted water, one time shape"
state = "current"
source = "rerun/paper1_gas/figures/gas_drying.pdf"
section_state = "partial"
note = "2026-11-02, from rerun/paper1_gas/results/gas.json (no recomputation). (a) water from the anchored M3 ladder (k v_lad, k = timing stack / ladder on the attachment-free rows: det6 0.970 +- 0.013, det7 0.984 +- 0.011) through Magboltz: det6 1.47 -> 0.76 %, det7 0.68 -> 0.35 % (01:00 -> 15:00), dashed = afternoon plateaus; grey = the golden rows 06:00-10:20. (b) excess over plateau, det6 / 2.17: r = 0.975. (c) det3 6-27 timing-v water per field (0.87 / 0.97 / 0.91 / 1.05 %) on the one-water fit 0.97 % [0.95, 0.99]; the 390 V/cm point sits near the velocity maximum, hence its wide interval. Checklist pass 2026-11-02: full width (6.1 in drawn, 6.22 in PDF), fonts embedded; titles -> (a)-(c), in-plot labels removed except det6 / 2.17, one legend above. Numbers unchanged. 2026-11-03: (c) dropped; left = measured k v_lad (a) over Magboltz-inverted water (b), shared time axis; right = excess over plateau."
producer = "cd rerun/paper1_gas && ../../.venv/bin/python pg_figs.py drying"

