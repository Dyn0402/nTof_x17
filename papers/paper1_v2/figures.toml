# Paper I v2 figure manifest -- read by ../make_figures.py (paper1_v2).
# Entries copied from ../paper1/figures.toml are unchanged (same source, same producer). New figures of the
# reorganisation (2026-11-10) have their script in papers/paper1_v2/figs/ and their output in figs/out/.
# Rule: nothing that shows a position, angle or depth from combined_hits times may be "current".

# --- reused from paper1 ----------------------------------------------------

[fig.experiment_layout]
