state = "current"
source = "papers/paper1/figs/out/experiment_layout.pdf"
producer = ".venv/bin/python papers/paper1/figs/make_experiment_layout.py"
note = "2026-11-06: new Fig. 1 (Dylan, feedback note Fig. 1): top-down layout + the old tpc_principle panel (a) as the blow-up. Distances rounded from MX17_Full_Geant SimConfig.hh; no data."

[fig.chamber_stack]
