# Paper II figure manifest -- read by ../make_figures.py. Keys as in ../paper1/figures.toml.
# Rule: nothing that shows a position, angle or depth from combined_hits times
# may be "current" unless the figure's point is to show that failure (then say so in `note`).

# --- 2 Signal formation -------------------------------------------------------

[fig.sharing_cartoon]
title = "Charge sharing on resistive strips"
state = "current"
source = "mx_june_cosmic_qa/engineer_package/figures/03-charge-sharing-schematic.pdf"
note = "Check it shows c2 < c1 (the +-2 strip is reached only through +-1)."

[fig.kernel_forms]
title = "Sharing kernel measured head-on at SPS without zero suppression (run71 RAW): +-1..3 responses and time forms, X and Y, three drift fields"
state = "current"
section_state = "ready"
source = "rerun/paper1_spsfigs/figures/kernel_forms.pdf"
producer = "cd rerun/paper1_spsfigs && ../../.venv/bin/python make_figs.py --only kernel_forms  (inputs: kernel_job.py on condor)"
note = "Final cache builder (oscillators, hot and coupled channels censored). +-1/lead X 0.377 Y 0.390, +-2/+-1 X 0.19 Y 0.26 at 243 V/cm, field-independent 96-243 V/cm. The old Y c2/c1 0.42-0.47 is superseded."
[fig.angled_kernel]
title = "Kernel survives a 25.4 deg rotation: run63 flat700 vs run63_rot25 d425/d325 (same run, one TAX access apart)"
state = "current"
source = "rerun/paper1_spsfigs/figures/angled_kernel.pdf"
producer = "cd rerun/paper1_spsfigs && ../../.venv/bin/python make_figs.py --only angled_kernel  (inputs: kernel_job.py on condor)"
note = "ZS rows, pass selection (peak >= 300 ADC, >= 4 strips): X (normal in both mounts) +-1 0.43/0.36 flat vs 0.43/0.35 rotated."
