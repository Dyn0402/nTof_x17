[fig.event_waveforms]
title = "One cosmic track on chamber A, X and Y: strip x time map with the leading-edge hits and their line, the waveform fit and the reference"
state = "current"
section_state = "partial"
source = "papers/paper2/figs/out/event_waveforms.pdf"
producer = ".venv/bin/python papers/paper2/figs/make_event_waveforms.py  (inputs on $WORK_DATA/paper2_hits: windows, eos_tables, bundles/det3)"
note = "Shows the hit ladder ON PURPOSE: the figure's point is that it reads steeper than the track (reconstruction-basis rule). Event chosen by a stated rule (most typical in hit bias and in the fit residual, both views, 0.14 <= |tan_ref| < 0.28; 2082 candidates): Run 1 event 6693. Reference 9.0/8.3 deg, fit 8.7/8.1, hits 10.4/10.4 (X/Y). Numbers and the rule in figs/out/event_waveforms.json. Replaces Stephan's display (2026-11-18)."

# --- 4 Forward model ----------------------------------------------------------

[fig.forward_model]
title = "The forward model on one plane: charge column, landing footprint and RC spreading, pulse response, seven strips with the model and its mesh-end / cathode-end contributions"
state = "current"
section_state = "ready"
source = "papers/paper2/figs/out/forward_model.pdf"
producer = ".venv/bin/python papers/paper2/figs/make_forward_model.py  (after make_event_waveforms.py: same event, Y view)"
note = "Production physical-RC model (wft.model.build_matrix_rc with the pass-1 chamber A bundle: sigma0 0.30 mm, Dp 0.023 mm/sqrt(ns), D_RC 3.8e-4 mm^2/ns, 60 ns bins); the model is rebuilt from the stored fit and matches the stored one to 5e-8. Numbers in figs/out/forward_model.json. 2026-11-18."

