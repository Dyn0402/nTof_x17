# Paper I figure log -- read by make_figures_deck.py (notes/mx17-paper1-figures).
# One [[entry]] per change, newest last. `fig` is the figures.toml id ("*" = all figures / the style).
# `status` (optional) sets the figure's review state from that entry on:
#   "not ready"  Dylan has seen it and it is not publication-ready
#   "in work"    being reworked
#   "for review" changed, waiting for Dylan to look
#   "accepted"   Dylan has accepted it
# Dylan 2026-11-02: "we'll have to work on these one-by-one over the next few days, so let's keep updating the
# current slides as we go and log the changes in the details."

