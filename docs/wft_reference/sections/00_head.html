<title>The waveform-first reconstruction — a complete reference</title>

<style>
/* ============================================================ tokens ===== */
:root {
  /* Ground and ink. Cool neutrals — instrument panel, not lab notebook. */
  --paper:      #f6f7f8;
  --panel:      #ffffff;
  --panel-2:    #eef0f2;
  --ink:        #14181c;
  --ink-2:      #3d474f;
  --ink-3:      #69737c;
  --rule:       #d7dbdf;
  --rule-soft:  #e6e9ec;

  /* Accent: pulled straight out of the `magma` colormap every waveform
     figure in this document is rendered with. */
  --ember:      #c2571b;
  --ember-soft: #f4e3d6;
  --ember-ink:  #8f3f12;

  /* The two detector planes keep one colour each, everywhere, including
     inside the figures. */
  --plane-x:    #2563eb;
  --plane-y:    #d01c45;

  /* Semantic: a measured fact, a warning, a hard rule. */
  --verified:    #0d6e63;
  --verified-bg: #dcefec;
  --caution:     #9a5b06;
  --caution-bg:  #f8ecd7;
  --rulebox:     #6d3fbf;
  --rulebox-bg:  #ece5fa;

  --shadow: 0 1px 2px rgba(20,24,28,.05), 0 8px 24px -16px rgba(20,24,28,.28);

  /* Android ships none of the first choices, so each stack ends on a Noto
     face — which has the Greek and mathematical coverage this document needs —
     before the generic family. */
  --serif: Charter, "Source Serif 4", "Iowan Old Style", "Bitstream Charter",
           Georgia, "Times New Roman", "Noto Serif", "Droid Serif", serif;
  --sans:  ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
           Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono:  ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo,
           Consolas, "Liberation Mono", "Noto Sans Mono", "Roboto Mono",
           "Droid Sans Mono", monospace;

  --measure: 68ch;
  --shell:   1180px;
  --toc-w:   282px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #0f1216;
    --panel:      #171b21;
    --panel-2:    #1e242b;
    --ink:        #e7ebee;
    --ink-2:      #b3bdc6;
    --ink-3:      #838f99;
    --rule:       #2b333b;
    --rule-soft:  #222931;

    --ember:      #f08b45;
    --ember-soft: #34220f;
    --ember-ink:  #f7b57e;

    --plane-x:    #6ba3ff;
    --plane-y:    #ff6b8c;

    --verified:    #4cc9b8;
    --verified-bg: #10312e;
    --caution:     #e2a94e;
    --caution-bg:  #33280f;
    --rulebox:     #b79cf5;
    --rulebox-bg:  #241c3a;

    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}

:root[data-theme="dark"] {
  --paper:      #0f1216;
  --panel:      #171b21;
  --panel-2:    #1e242b;
  --ink:        #e7ebee;
  --ink-2:      #b3bdc6;
  --ink-3:      #838f99;
  --rule:       #2b333b;
  --rule-soft:  #222931;
  --ember:      #f08b45;
  --ember-soft: #34220f;
  --ember-ink:  #f7b57e;
  --plane-x:    #6ba3ff;
  --plane-y:    #ff6b8c;
  --verified:    #4cc9b8;
  --verified-bg: #10312e;
  --caution:     #e2a94e;
  --caution-bg:  #33280f;
  --rulebox:     #b79cf5;
  --rulebox-bg:  #241c3a;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
}

:root[data-theme="light"] {
  --paper:      #f6f7f8;
  --panel:      #ffffff;
  --panel-2:    #eef0f2;
  --ink:        #14181c;
  --ink-2:      #3d474f;
  --ink-3:      #69737c;
  --rule:       #d7dbdf;
  --rule-soft:  #e6e9ec;
  --ember:      #c2571b;
  --ember-soft: #f4e3d6;
  --ember-ink:  #8f3f12;
  --plane-x:    #2563eb;
  --plane-y:    #d01c45;
  --verified:    #0d6e63;
  --verified-bg: #dcefec;
  --caution:     #9a5b06;
  --caution-bg:  #f8ecd7;
  --rulebox:     #6d3fbf;
  --rulebox-bg:  #ece5fa;
  --shadow: 0 1px 2px rgba(20,24,28,.05), 0 8px 24px -16px rgba(20,24,28,.28);
}

/* ============================================================ base ====== */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* reading progress — a 100-page document earns one */
#progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: var(--ember); z-index: 60; transition: width .1s linear;
}

a { color: var(--ember-ink); text-decoration-thickness: .06em;
    text-underline-offset: .18em; }
a:hover { color: var(--ember); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px;
                 border-radius: 2px; }

/* ============================================================ shell ===== */
.shell {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0 24px 8rem;
  display: grid;
  grid-template-columns: var(--toc-w) minmax(0, 1fr);
  gap: 0 48px;
  align-items: start;
}

main { min-width: 0; grid-column: 2; }
main > * { max-width: var(--measure); }

/* figures and tables break out of the text measure */
main > figure, main > .wide, main > .grid2, main > .tablewrap {
  max-width: min(100%, 860px);
}

/* ============================================================ toc ======= */
#tocwrap {
  grid-column: 1;
  position: sticky; top: 0;
  max-height: 100vh; overflow-y: auto;
  padding: 2.2rem 0 3rem;
  font-family: var(--sans);
  font-size: 12.5px;
  line-height: 1.45;
  scrollbar-width: thin;
}
#tocwrap .tochead {
  font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 700; margin: 0 0 .9rem;
}
#toc { list-style: none; margin: 0; padding: 0; }
#toc li { margin: 0; }
#toc a {
  display: block; padding: 3px 10px 3px 12px; color: var(--ink-2);
  text-decoration: none; border-left: 2px solid transparent;
}
#toc a:hover { color: var(--ink); background: var(--panel-2); }
#toc a.lvl-part {
  margin-top: .95rem; font-weight: 700; color: var(--ink);
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
}
#toc a.lvl-3 { padding-left: 24px; font-size: 12px; color: var(--ink-3); }
#toc a.active {
  color: var(--ember-ink); border-left-color: var(--ember);
  background: var(--ember-soft);
}
#toc a.lvl-part.active { color: var(--ember-ink); }

/* mobile drawer controls, hidden on desktop */
#topbar, #scrim { display: none; }

/* ============================================================ type ====== */
h1, h2, h3, h4, .partno, .eyebrow {
  font-family: var(--sans);
  text-wrap: balance;
}

h1 {
  font-size: clamp(2.1rem, 5.2vw, 3.1rem);
  line-height: 1.06; letter-spacing: -.028em; font-weight: 800;
  margin: 0 0 .6rem;
}
h2 {
  font-size: clamp(1.42rem, 2.9vw, 1.85rem);
  line-height: 1.18; letter-spacing: -.022em; font-weight: 750;
  margin: 4.2rem 0 .2rem; scroll-margin-top: 1.5rem;
}
h3 {
  font-size: 1.12rem; line-height: 1.3; letter-spacing: -.012em;
  font-weight: 700; margin: 2.4rem 0 .1rem; scroll-margin-top: 1.5rem;
  color: var(--ink);
}
h4 {
  font-size: .96rem; font-weight: 700; letter-spacing: .005em;
  margin: 1.7rem 0 .1rem; color: var(--ink-2);
}
p { margin: .95rem 0; }
strong { font-weight: 700; color: var(--ink); }
em { font-style: italic; }

/* the sample-grid motif: 60 ns ticks, the DAQ's own unit */
.part {
  grid-column: 1 / -1;
  max-width: none;
  margin: 6rem 0 0;
  padding: 2.1rem 0 1.5rem;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule-soft);
  background-image: repeating-linear-gradient(
    to right, var(--rule-soft) 0 1px, transparent 1px 28px);
  background-size: 100% 12px;
  background-repeat: no-repeat;
  background-position: 0 0;
}
.part .partno {
  font-size: 10.5px; letter-spacing: .17em; text-transform: uppercase;
  color: var(--ember); font-weight: 700; display: block; margin-bottom: .45rem;
}
.part h2 {
  margin: 0; font-size: clamp(1.7rem, 4vw, 2.35rem); letter-spacing: -.03em;
  font-weight: 800;
}
.part .sub {
  font-family: var(--serif); color: var(--ink-2); font-size: 1.02rem;
  margin: .55rem 0 0; max-width: 62ch;
}

.eyebrow {
  font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 700; margin: 0 0 .4rem;
}

.lede {
  font-size: 1.14rem; line-height: 1.62; color: var(--ink-2);
  max-width: 60ch;
}

/* ============================================================ code ====== */
code, .k, kbd {
  font-family: var(--mono);
  font-size: .855em;
  font-variant-ligatures: none;
}
p code, li code, td code, th code, dd code, dt code {
  background: var(--panel-2); padding: .08em .34em; border-radius: 3px;
  color: var(--ink);
}
/* parameter chips — the hypers get a consistent look so they become
   recognisable objects rather than letters */
.hy {
  font-family: var(--mono); font-size: .82em; font-weight: 600;
  background: var(--ember-soft); color: var(--ember-ink);
  padding: .1em .4em; border-radius: 3px; white-space: nowrap;
}
pre {
  font-family: var(--mono); font-size: 12.6px; line-height: 1.6;
  background: var(--panel); color: var(--ink-2);
  border: 1px solid var(--rule); border-radius: 6px;
  padding: 14px 16px; overflow-x: auto; margin: 1.3rem 0;
  max-width: min(100%, 860px);
}
pre .c { color: var(--ink-3); font-style: italic; }
pre .s { color: var(--verified); }
pre .n { color: var(--ember-ink); }

/* ============================================================ figures === */
figure {
  margin: 2.1rem 0 2.3rem;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 16px 16px 12px;
  box-shadow: var(--shadow);
}
figure img { display: block; width: 100%; height: auto; }
figure .figscroll { overflow-x: auto; }
figcaption {
  font-family: var(--sans); font-size: 12.8px; line-height: 1.55;
  color: var(--ink-2); margin-top: .85rem;
  padding-top: .7rem; border-top: 1px solid var(--rule-soft);
}
figcaption .fignum {
  font-weight: 700; color: var(--ember-ink); letter-spacing: .01em;
}
figcaption .src {
  display: block; margin-top: .4rem; font-family: var(--mono);
  font-size: 11px; color: var(--ink-3);
}

/* ============================================================ callouts == */
.box {
  margin: 1.6rem 0; padding: 14px 18px; border-radius: 7px;
  border-left: 3px solid var(--ink-3); background: var(--panel);
  font-size: .96rem;
}
.box > :first-child { margin-top: 0; }
.box > :last-child { margin-bottom: 0; }
.box .lbl {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; display: block;
  margin-bottom: .35rem;
}
.box.rule   { border-left-color: var(--rulebox);  background: var(--rulebox-bg); }
.box.rule .lbl   { color: var(--rulebox); }
.box.meas   { border-left-color: var(--verified); background: var(--verified-bg); }
.box.meas .lbl   { color: var(--verified); }
.box.warn   { border-left-color: var(--caution);  background: var(--caution-bg); }
.box.warn .lbl   { color: var(--caution); }
.box.open   { border-left-color: var(--ember);    background: var(--ember-soft); }
.box.open .lbl   { color: var(--ember-ink); }
.box.code   { border-left-color: var(--ink-3);    background: var(--panel-2); }
.box.code .lbl   { color: var(--ink-3); }

/* ============================================================ tables ==== */
.tablewrap { overflow-x: auto; margin: 1.5rem 0; }
table {
  border-collapse: collapse; width: 100%; font-family: var(--sans);
  font-size: 13.2px; font-variant-numeric: tabular-nums;
}
th, td {
  text-align: left; padding: 7px 12px 7px 0;
  border-bottom: 1px solid var(--rule-soft); vertical-align: top;
}
thead th {
  font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 700; border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}
tbody tr:last-child td { border-bottom: 1px solid var(--rule); }
td.num, th.num { text-align: right; padding-right: 18px; }
tbody tr:hover td { background: var(--panel-2); }
table .win { color: var(--verified); font-weight: 700; }
table .bad { color: var(--plane-y); font-weight: 700; }
caption {
  caption-side: top; text-align: left; font-family: var(--sans);
  font-size: 12.5px; color: var(--ink-2); padding-bottom: .55rem;
}

/* ============================================================ lists ===== */
ul, ol { padding-left: 1.35rem; margin: .95rem 0; }
li { margin: .38rem 0; }
li > ul, li > ol { margin: .3rem 0; }

dl.params { margin: 1.3rem 0; }
dl.params dt {
  font-family: var(--mono); font-size: .87rem; font-weight: 700;
  color: var(--ember-ink); margin-top: .95rem;
}
dl.params dd { margin: .12rem 0 0; padding-left: 0; color: var(--ink-2);
               font-size: .97rem; }

/* ============================================================ misc ===== */
.grid2 {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  margin: 1.6rem 0;
}
.card {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 7px;
  padding: 14px 16px; font-size: .95rem;
}
.card h4 { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }

.stat { font-family: var(--sans); }
.stat .v {
  display: block; font-size: 1.72rem; font-weight: 800; letter-spacing: -.02em;
  line-height: 1.1; font-variant-numeric: tabular-nums;
}
.stat .l { display: block; font-size: 11.5px; color: var(--ink-3);
           letter-spacing: .05em; text-transform: uppercase; font-weight: 700;
           margin-top: .3rem; }
.stat.x .v { color: var(--plane-x); }
.stat.y .v { color: var(--plane-y); }
.stat.e .v { color: var(--ember); }
.stat.g .v { color: var(--verified); }

hr {
  border: 0; border-top: 1px solid var(--rule); margin: 2.6rem 0;
  max-width: var(--measure);
}

.eq {
  font-family: var(--mono); font-size: 13px; line-height: 1.85;
  background: var(--panel); border: 1px solid var(--rule);
  border-left: 3px solid var(--ember); border-radius: 6px;
  padding: 14px 18px; margin: 1.4rem 0; overflow-x: auto;
  max-width: min(100%, 860px);
}
.eq .lhs { color: var(--ember-ink); }
.eq .note { color: var(--ink-3); }

svg.diagram { display: block; width: 100%; height: auto; }
svg.diagram text { font-family: var(--sans); }

.footer {
  grid-column: 1 / -1; max-width: none; margin-top: 5rem;
  padding-top: 1.6rem; border-top: 1px solid var(--rule);
  font-family: var(--sans); font-size: 12.5px; color: var(--ink-3);
}

/* ============================================================ mobile ==== */
@media (max-width: 1000px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
    padding: 0 20px 6rem; gap: 0;
  }
  main { grid-column: 1; }
  main > * { max-width: 100%; }
  main > figure, main > .wide, main > .grid2, main > .tablewrap,
  pre, .eq { max-width: 100%; }

  #topbar {
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 50;
    margin: 0 -20px 0; padding: 10px 16px;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
    font-family: var(--sans);
  }
  #topbar button {
    font-family: var(--sans); font-size: 12px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    background: var(--panel); color: var(--ink); cursor: pointer;
    border: 1px solid var(--rule); border-radius: 5px; padding: 7px 11px;
  }
  #topbar .now {
    font-size: 12px; color: var(--ink-3); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }

  #tocwrap {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(84vw, 330px);
    z-index: 55; background: var(--panel); border-right: 1px solid var(--rule);
    padding: 18px 8px 40px; transform: translateX(-102%);
    transition: transform .22s ease; max-height: none;
  }
  #tocwrap.open { transform: none; }
  #scrim {
    display: block; position: fixed; inset: 0; z-index: 54;
    background: rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .22s ease;
  }
  #scrim.on { opacity: 1; pointer-events: auto; }

  body { font-size: 16.5px; }
  figure { padding: 10px 10px 8px; margin-left: -4px; margin-right: -4px; }
  .part { margin-top: 4rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important;
      scroll-behavior: auto !important; }
}

@media print {
  #tocwrap, #topbar, #progress, #scrim { display: none !important; }
  .shell { display: block; max-width: none; }
  figure { break-inside: avoid; box-shadow: none; }
  h2, h3 { break-after: avoid; }
}
</style>

<div id="progress"></div>

<div id="topbar">
  <button id="tocbtn" aria-expanded="false" aria-controls="tocwrap">Contents</button>
  <span class="now" id="nowreading">The waveform-first reconstruction</span>
</div>
<div id="scrim"></div>

<div class="shell">

<nav id="tocwrap" aria-label="Table of contents">
  <p class="tochead">Contents</p>
  <ul id="toc"></ul>
</nav>
